# =============================================================================
# Default case. Every study in studies.yaml overrides a subset of these keys.
# =============================================================================

panel:
  shape: pyramid              # pyramid | tetrahedron | hemisphere
  volume_ml: 250.0            # external envelope volume (paper: 250 mL)
  protrusion_ratio: 0.5       # fraction of envelope volume inside the protrusions
  shell_thickness_mm: 1.0     # paper: 1 mm
  gap_mm: 0.0                 # clear gap between neighbouring protrusion bases
  # Array layout. Paper: 2x2 pyramids; 4 tetrahedra (2 up + 2 down) on a
  # 60-degree parallelogram; hemispheres use the pyramid layout.
  n_x: 2
  n_y: 2
  # Reference design (protrusion_ratio = 0.5, gap = 0) that fixes the footprint.
  # Sec. 4.5/4.7: footprint is kept when the ratio changes; the geometry scales
  # self-similarly with volume.
  pyramid_edge_angle_deg: 43.0        # [PAPER] Sec. 4.5, lateral edge vs base
  tetrahedron_edge_angle_deg: 54.7356 # [PAPER] Sec. 4.5 (= regular tetrahedron)
  hemisphere_fill: 0.95               # [ASSUMPTION] R_ref = fill * pitch / 2

delta_T: 20.0                 # T_air - T_pcm0 [K]; T_pcm0 stays 278.15 K (Sec. 4.2)

mesh:
  preset: medium              # smoke | coarse | medium | fine  (paper: 8.6e5 / 1.1e6 / 1.7e6)
  # Keep base_cell = 0.128 m: refinement level L then gives 128 mm / 2^L
  # (level 7 = 1 mm, 8 = 0.5 mm). Shell level = max(surface_level_min,
  # ceil(log2(base_cell * shell_cells_across / t))). Cell counts are estimates;
  # read the real ones from log.checkMesh.* and tune.
  presets:
    smoke:                    # plumbing test only (1 cell across the shell)
      base_cell: 0.128
      shell_cells_across: 1
      surface_level_min: 6
      pcm_level: 6
      air_distance_levels: [[0.004, 6], [0.015, 5], [0.04, 4], [0.1, 3]]
      plume_level: 2
      wall_layer_passes: {air: 0, pcm: 0}
    coarse:
      base_cell: 0.128        # background blockMesh cell [m]
      shell_cells_across: 2
      surface_level_min: 7
      pcm_level: 6
      air_distance_levels: [[0.002, 7], [0.008, 6], [0.02, 5], [0.05, 4], [0.12, 3]]
      plume_level: 2
      wall_layer_passes: {air: 1, pcm: 1}
    medium:
      base_cell: 0.128
      shell_cells_across: 2
      surface_level_min: 7
      pcm_level: 7
      air_distance_levels: [[0.003, 7], [0.010, 6], [0.025, 5], [0.06, 4], [0.15, 3]]
      plume_level: 3
      wall_layer_passes: {air: 1, pcm: 1}
    fine:
      base_cell: 0.128
      shell_cells_across: 2
      surface_level_min: 8
      pcm_level: 7
      air_distance_levels: [[0.005, 7], [0.015, 6], [0.035, 5], [0.08, 4], [0.2, 3]]
      plume_level: 3
      wall_layer_passes: {air: 2, pcm: 2}
  wall_layer_edge_fraction: 0.4   # refineWallLayer split position (first cell = 0.4 h)
  n_cells_between_levels: 2
  feature_angle: 150              # surfaceFeatureExtract includedAngle
  stl_tolerance_mm: 0.02          # CAD tessellation chord tolerance
  ceiling_extension_mm: 5.0       # outer STL pushed through the ceiling (snappy hygiene)

run:
  end_time_min: auto              # auto => stop when melted (see stop_liquid_fraction)
  max_end_time_min: 900
  stop_liquid_fraction: 0.9995    # run ends after the PCM is this fully melted
  melt_threshold_100: 0.999       # "100 % melted" detection threshold
  write_interval_min: 10          # field write interval (50/150/250/300 min hit exactly)
  sample_interval_s: 30           # function-object sampling interval
  n_procs: 8
  decomposition: scotch

post:
  contour_times_min: [50, 150, 250, 300]
  T_range_C: [14.0, 25.0]         # paper Fig. 9 colour bars
  U_range_mm_s: [0.0, 22.8]
  view_half_width_m: 0.09
  view_depth_m: 0.14
  image_size: [1600, 900]

tools:                            # executables (override if not on PATH)
  freecadcmd: freecadcmd
  pvpython: pvpython
  mpirun: mpirun
