# =============================================================================
# Parametric studies. Each study is the cartesian product of its `vary` lists,
# applied on top of base_case.yaml. Keys use dotted paths into base_case.yaml.
# Paper sections are given for the studies that reproduce published results.
# =============================================================================

validation:                       # Sec. 3.7 / 4.1 (Figs. 8-10)
  vary:
    panel.shape: [pyramid, tetrahedron]

shapes:                           # new product comparison incl. hemispheres
  vary:
    panel.shape: [pyramid, tetrahedron, hemisphere]

delta_T:                          # Sec. 4.2 (Fig. 11)
  vary:
    panel.shape: [pyramid, tetrahedron, hemisphere]
    delta_T: [15, 20, 25, 30]

shell_thickness:                  # Sec. 4.3 (Fig. 12)
  vary:
    panel.shape: [pyramid, tetrahedron, hemisphere]
    panel.shell_thickness_mm: [1, 3, 5]

protrusion_ratio:                 # Sec. 4.5 (Fig. 15)
  vary:
    panel.shape: [pyramid, tetrahedron, hemisphere]
    panel.protrusion_ratio: [0.3, 0.5, 0.7]

gap:                              # Sec. 4.6 (Fig. 17)
  vary:
    panel.shape: [pyramid, tetrahedron, hemisphere]
    panel.gap_mm: [0, 3, 5]

volume:                           # Sec. 4.7 (Fig. 18)
  vary:
    panel.shape: [pyramid, tetrahedron, hemisphere]
    panel.volume_ml: [250, 500, 750]

mesh_independence:                # Sec. 3.5 (Fig. 7)
  vary:
    mesh.preset: [coarse, medium, fine]

smoke:                            # plumbing test (0.6 s of flow, ~60 steps), not physics
  vary:
    panel.shape: [pyramid]
  override:
    mesh.preset: smoke
    run.end_time_min: 0.01
    run.write_interval_min: 0.005
    run.n_procs: 4
    post.contour_times_min: [0.005, 0.01]
    run.sample_interval_s: 0.05

# ---------------------------------------------------------------------------
# n-octadecane panels under a Kharagpur RCC roof (PMAY retrofit), from 06:00 on
# a hot May day (config/materials.yaml, config/loads.yaml). Run either way:
#   python3 -m pcmpipe all --study octadecane_roof --mode screening --np 4   # laptop
#   python3 -m pcmpipe all --study octadecane_roof --np 16 --np-mesh 16      # workstation
# ---------------------------------------------------------------------------
octadecane_roof:
  vary:
    panel.shape: [pyramid, tetrahedron, hemisphere]
  override:
    pcm_material: n_octadecane
    loads: kharagpur_roof
    run.max_end_time_min: 720     # 06:00-18:00, or earlier once fully melted
    run.write_interval_min: 60    # fields hourly (the curves are sampled every 30 s)
    post.contour_times_min: [60, 120, 180, 240, 360, 480, 600, 720]
    post.T_range_C: [24.0, 40.0]
  id_suffix: false                # ids already carry _kgp_c18

smoke_roof:                       # plumbing test of the n-octadecane / roof-load set-up
  vary:
    panel.shape: [pyramid]
  override:
    pcm_material: n_octadecane
    loads: kharagpur_roof
    mesh.preset: smoke
    run.end_time_min: 0.01
    run.write_interval_min: 0.005
    run.n_procs: 4
    post.contour_times_min: [0.005, 0.01]
    post.T_range_C: [24.0, 40.0]
    run.sample_interval_s: 0.05
  id_suffix: false
